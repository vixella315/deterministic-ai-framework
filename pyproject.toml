[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deterministic-ai-framework"
version = "0.1.0"
description = "Schema-first control and governance infrastructure around probabilistic AI systems."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "TBD"}
authors = [{name = "vixella315"}]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
